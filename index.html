<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Private Voice Call</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #38bdf8;
      font-size: 24px;
    }

    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
      font-size: 14px;
    }

    .status.ready { background: #075985; color: #bae6fd; }
    .status.calling { background: #854d0e; color: #fef08a; }
    .status.connected { background: #065f46; color: #a7f3d0; }
    .status.error { background: #991b1b; color: #fecaca; }

    .box {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
    }

    .label {
      margin-bottom: 6px;
      color: #94a3b8;
      font-size: 12px;
    }

    .my-id {
      min-height: 24px;
      color: #f472b6;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      user-select: all;
      word-break: break-all;
    }

    input, button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      font: inherit;
    }

    input {
      margin: 8px 0;
      padding: 13px;
      border: 1px solid #475569;
      outline: none;
      background: #0f172a;
      color: #fff;
      text-align: center;
      font-size: 16px;
    }

    input:focus { border-color: #38bdf8; }

    button {
      margin-top: 9px;
      padding: 13px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .btn-start { background: #2563eb; }
    .btn-copy { background: #475569; padding: 9px; font-size: 13px; }
    .btn-call { background: #10b981; }
    .btn-mute { background: #f59e0b; }
    .btn-unmute { background: #38bdf8; color: #082f49; }
    .btn-end { background: #ef4444; }

    .timer {
      display: none;
      margin: 14px 0 4px;
      color: #38bdf8;
      font-size: 24px;
      font-weight: 700;
    }

    .call-controls { display: none; }

    /* display:none မသုံးပါ။ Mobile Browser တချို့က hidden audio ကို မဖွင့်ပါ။ */
    #remote-audio {
      position: fixed;
      left: -10px;
      bottom: -10px;
      width: 2px;
      height: 2px;
      opacity: .01;
      pointer-events: none;
    }

    .hint {
      margin: 14px 0 0;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Private Voice Call</h1>
    <div id="status" class="status">အသံစနစ် စတင်ရန်လိုပါသည်</div>

    <button id="btn-start" class="btn-start">Microphone စတင်မည်</button>

    <section id="id-box" class="box" style="display:none;">
      <div class="label">သင်၏ Call ID ကို တစ်ဖက်လူထံ ပို့ပါ</div>
      <div id="my-id" class="my-id">...</div>
      <button id="btn-copy" class="btn-copy">ID ကို Copy ကူးမည်</button>
    </section>

    <section id="dial-box" class="box" style="display:none;">
      <div class="label">တစ်ဖက်လူ၏ Call ID</div>
      <input id="remote-id" type="text" inputmode="text" autocomplete="off" placeholder="ဥပမာ love-1234" />
      <button id="btn-call" class="btn-call">ဖုန်းခေါ်မည်</button>
    </section>

    <div id="timer" class="timer">00:00</div>

    <!-- Audio ကို display:none မလုပ်ထားပါ -->
    <audio id="remote-audio" autoplay playsinline webkit-playsinline></audio>

    <section id="call-controls" class="call-controls">
      <button id="btn-unmute" class="btn-unmute">🔊 အသံကြားရန် ဒီနေရာကို နှိပ်ပါ</button>
      <button id="btn-mute" class="btn-mute">အသံပိတ်မည် (Mute)</button>
      <button id="btn-end" class="btn-end">ဖုန်းချမည်</button>
    </section>

    <p class="hint">
      နှစ်ဖက်လုံးက Microphone ခွင့်ပြုချက်ကို Allow လုပ်ထားပြီး<br />
      ဖုန်း Media Volume ကို မြှင့်ထားပါ။
    </p>
  </main>

  <script>
    "use strict";

    let peer = null;
    let localStream = null;
    let currentCall = null;
    let timerInterval = null;
    let seconds = 0;
    let isMuted = false;
    let isReady = false;

    const $ = (id) => document.getElementById(id);

    const statusEl = $("status");
    const startBtn = $("btn-start");
    const copyBtn = $("btn-copy");
    const callBtn = $("btn-call");
    const endBtn = $("btn-end");
    const muteBtn = $("btn-mute");
    const unmuteBtn = $("btn-unmute");
    const idBox = $("id-box");
    const dialBox = $("dial-box");
    const myIdEl = $("my-id");
    const remoteIdInput = $("remote-id");
    const timerEl = $("timer");
    const callControls = $("call-controls");
    const remoteAudio = $("remote-audio");

    // Demo အတွက် public STUN/TURN server များ။ Production တွင် ကိုယ်ပိုင် TURN server သုံးပါ။
    const peerOptions = {
      debug: 1,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject"
          },
          {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject"
          },
          {
            urls: "turns:openrelay.metered.ca:443?transport=tcp",
            username: "openrelayproject",
            credential: "openrelayproject"
          }
        ],
        sdpSemantics: "unified-plan"
      }
    };

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function setButtonsEnabled(enabled) {
      callBtn.disabled = !enabled;
      copyBtn.disabled = !enabled;
      remoteIdInput.disabled = !enabled;
    }

    function isSecureEnough() {
      return window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    }

    function getMicrophoneWithTimeout(constraints, timeoutMs = 12000) {
      return Promise.race([
        navigator.mediaDevices.getUserMedia(constraints),
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error("MIC_PERMISSION_TIMEOUT")), timeoutMs);
        })
      ]);
    }

    async function startMicrophone() {
      if (!isSecureEnough()) {
        setStatus("HTTPS မဟုတ်သဖြင့် Microphone မရပါ", "error");
        alert("ဒီ Website ကို HTTPS ဖြင့် ဖွင့်ပါ။ localhost ဖြစ်ရင် HTTP သုံးနိုင်ပါတယ်။");
        return;
      }

      startBtn.disabled = true;
      setStatus("Microphone ခွင့်ပြုချက် စောင့်နေသည်...", "calling");

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("getUserMedia is not supported");
        }

        localStream = await getMicrophoneWithTimeout({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1
          },
          video: false
        });

        const track = localStream.getAudioTracks()[0];
        if (!track) throw new Error("No microphone track");
        track.enabled = true;

        // User gesture အတွင်း Audio ကို unlock လုပ်ရန်
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;
        try { await remoteAudio.play(); } catch (_) {}

        await createPeer();
        isReady = true;
        startBtn.style.display = "none";
        idBox.style.display = "block";
        dialBox.style.display = "block";
        setButtonsEnabled(true);
        setStatus("Online ဖြစ်ပါပြီ", "ready");
      } catch (error) {
        console.error("Microphone error:", error);
        startBtn.disabled = false;
        if (error.message === "MIC_PERMISSION_TIMEOUT") {
          setStatus("Permission မပေါ်ပါ။ Settings မှ Allow လုပ်ပါ", "error");
          alert("Microphone ခွင့်ပြုချက်စာ မပေါ်ပါက ဖုန်း Settings → Privacy & Security → Microphone → Chrome ကို ON လုပ်ပြီး ဒီစာမျက်နှာကို Reload လုပ်ပါ။");
        } else if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
          setStatus("Microphone Permission ပိတ်ထားသည်", "error");
          alert("ဒီ Website အတွက် Microphone Permission ကို Allow လုပ်ပြီး ပြန်စမ်းပါ။");
        } else {
          setStatus("Microphone ဖွင့်၍မရပါ", "error");
          alert("Browser နှင့် ဖုန်း Settings နှစ်နေရာလုံးတွင် Microphone Permission ကို Allow လုပ်ပြီး ပြန်စမ်းပါ။");
        }
      }
    }

    function createPeer() {
      return new Promise((resolve, reject) => {
        const shortId = "love-" + Math.floor(1000 + Math.random() * 9000);
        peer = new Peer(shortId, peerOptions);

        peer.on("open", (id) => {
          myIdEl.textContent = id;
          resolve();
        });

        peer.on("call", (incomingCall) => {
          if (!isReady || !localStream) {
            incomingCall.close();
            return;
          }

          if (currentCall) currentCall.close();
          setStatus("ဖုန်းဝင်နေသည်...", "calling");
          incomingCall.answer(localStream);
          setupCall(incomingCall);
        });

        peer.on("disconnected", () => {
          setStatus("Server နှင့် ပြတ်သွားပါသည်... ပြန်ချိတ်နေသည်", "calling");
          if (peer && !peer.destroyed) peer.reconnect();
        });

        peer.on("close", () => {
          setStatus("Connection ပိတ်သွားပါပြီ", "error");
        });

        peer.on("error", (error) => {
          console.error("PeerJS error:", error);
          if (error.type === "peer-unavailable") {
            setStatus("တစ်ဖက်လူ Online မရှိပါ", "error");
            alert("တစ်ဖက်လူ၏ ID မှန်/Online ဖြစ်မဖြစ် စစ်ပါ။");
          } else if (error.type === "unavailable-id") {
            setStatus("ID ထပ်နေပါသည်။ ပြန်စတင်ပါ", "error");
          } else {
            setStatus("ချိတ်ဆက်မှု အခက်အခဲ ဖြစ်နေသည်", "error");
          }
        });

        setTimeout(() => {
          if (!peer || !peer.open) reject(new Error("Peer server timeout"));
        }, 15000);
      });
    }

    function startCall() {
      if (!isReady || !peer || !localStream) {
        alert("အရင်ဆုံး Microphone စတင်ပါ။");
        return;
      }

      const targetId = remoteIdInput.value.trim().toLowerCase();
      if (!targetId) {
        alert("တစ်ဖက်လူ၏ Call ID ကို ထည့်ပါ။");
        remoteIdInput.focus();
        return;
      }

      if (targetId === myIdEl.textContent.toLowerCase()) {
        alert("မိမိ၏ ID ကို မိမိထံ ပြန်မခေါ်နိုင်ပါ။");
        return;
      }

      if (currentCall) currentCall.close();
      setStatus("ဖုန်းခေါ်နေသည်...", "calling");
      const outgoingCall = peer.call(targetId, localStream);
      setupCall(outgoingCall);
    }

    function setupCall(call) {
      currentCall = call;
      showCallUI();

      call.on("stream", async (remoteStream) => {
        console.log("Remote stream received", remoteStream);

        const audioTracks = remoteStream.getAudioTracks();
        if (!audioTracks.length) {
          setStatus("တစ်ဖက်တွင် Microphone အသံမရှိပါ", "error");
          return;
        }

        audioTracks.forEach(track => track.enabled = true);
        remoteAudio.srcObject = new MediaStream(audioTracks);
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;

        try {
          await remoteAudio.play();
          unmuteBtn.style.display = "none";
        } catch (error) {
          console.warn("Autoplay blocked", error);
          unmuteBtn.style.display = "block";
          setStatus("အသံဖွင့်ရန် အပြာရောင်ခလုတ်ကို နှိပ်ပါ", "calling");
        }

        setStatus("စကားပြောနေသည်", "connected");
        startTimer();
      });

      call.on("close", () => {
        if (currentCall === call) {
          setStatus("ဖုန်းချသွားပါပြီ", "ready");
          cleanupCall();
        }
      });

      call.on("error", (error) => {
        console.error("Call error:", error);
        setStatus("Call အသံချိတ်ဆက်မှု မအောင်မြင်ပါ", "error");
        cleanupCall();
      });

      // PeerJS က peerConnection တည်ဆောက်ပြီးနောက် ICE state ကိုစောင့်ကြည့်ပါ။
      setTimeout(() => {
        const pc = call.peerConnection;
        if (!pc) return;
        pc.oniceconnectionstatechange = () => {
          const state = pc.iceConnectionState;
          console.log("ICE state:", state);
          if (state === "failed") {
            setStatus("Network မကောင်းသဖြင့် Call မချိတ်နိုင်ပါ", "error");
          } else if (state === "connected" || state === "completed") {
            setStatus("စကားပြောနေသည်", "connected");
          }
        };
      }, 500);
    }

    function showCallUI() {
      idBox.style.display = "none";
      dialBox.style.display = "none";
      callControls.style.display = "block";
      endBtn.style.display = "block";
      muteBtn.style.display = "block";
      timerEl.style.display = "block";
    }

    function cleanupCall() {
      stopTimer();
      remoteAudio.pause();
      remoteAudio.srcObject = null;
      currentCall = null;
      isMuted = false;
      if (localStream) {
        const track = localStream.getAudioTracks()[0];
        if (track) track.enabled = true;
      }
      muteBtn.textContent = "အသံပိတ်မည် (Mute)";
      muteBtn.style.background = "#f59e0b";
      unmuteBtn.style.display = "none";
      callControls.style.display = "none";
      idBox.style.display = "block";
      dialBox.style.display = "block";
      timerEl.style.display = "none";
    }

    function endCall() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      cleanupCall();
      setStatus("ဖုန်းချလိုက်ပါပြီ", "ready");
    }

    async function forcePlayAudio() {
      try {
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;
        await remoteAudio.play();
        unmuteBtn.style.display = "none";
        setStatus("စကားပြောနေသည်", "connected");
      } catch (error) {
        console.error("Audio play failed:", error);
        alert("ဖုန်း Media Volume ကို မြှင့်ပါ။ Silent Mode ပိတ်ပြီး နားကြပ်ဖြင့်လည်း စမ်းပါ။");
      }
    }

    function toggleMute() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (!track) return;

      isMuted = !isMuted;
      track.enabled = !isMuted;
      muteBtn.textContent = isMuted ? "အသံပြန်ဖွင့်မည် (Unmute)" : "အသံပိတ်မည် (Mute)";
      muteBtn.style.background = isMuted ? "#64748b" : "#f59e0b";
    }

    function startTimer() {
      stopTimer();
      seconds = 0;
      timerEl.textContent = "00:00";
      timerInterval = setInterval(() => {
        seconds++;
        const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");
        timerEl.textContent = `${minutes}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      seconds = 0;
      timerEl.textContent = "00:00";
    }

    async function copyMyId() {
      const id = myIdEl.textContent;
      try {
        await navigator.clipboard.writeText(id);
        copyBtn.textContent = "Copy ကူးပြီးပါပြီ ✓";
        setTimeout(() => copyBtn.textContent = "ID ကို Copy ကူးမည်", 1800);
      } catch (_) {
        alert("ID: " + id);
      }
    }

    startBtn.addEventListener("click", startMicrophone);
    callBtn.addEventListener("click", startCall);
    endBtn.addEventListener("click", endCall);
    muteBtn.addEventListener("click", toggleMute);
    unmuteBtn.addEventListener("click", forcePlayAudio);
    copyBtn.addEventListener("click", copyMyId);
    remoteIdInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") startCall();
    });

    // စတင်ချိန်တွင် Call ခလုတ်များ ပိတ်ထားမည်။
    setButtonsEnabled(false);
  </script>
</body>
</html>
