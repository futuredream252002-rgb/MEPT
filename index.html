<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐌ʏ𝐬𝐭𝐨𝐐𝐭 Prediction Tool</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --win-color: #00e676;
            --lose-color: #ff1744;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: var(--accent-color); margin-bottom: 20px; }
        .status-box {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .prediction-card {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .prediction-title { font-size: 1.1rem; opacity: 0.9; }
        .prediction-value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; letter-spacing: 2px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 0.8rem; opacity: 0.7; }
        .stat-val { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { filter: brightness(1.2); }
        .log-section {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .log-item { margin-bottom: 5px; }
        .log-info { color: #3498db; }
        .log-success { color: var(--win-color); }
        .log-error { color: var(--lose-color); }
        .log-warn { color: #f1c40f; }
    </style>
</head>
<body>

<div class="container">
    <h2>𝐌ʏ𝐬𝐭𝐨𝐐𝐭 Dashboard</h2>
    
    <div class="status-box">
        <div>Status: <span id="bot-status" style="color: var(--win-color); font-weight:bold;">● RUNNING</span></div>
        <div>Next Update: <span id="countdown">--s</span></div>
    </div>

    <div class="prediction-card">
        <div class="prediction-title" id="pred-issue">MATCH: -----</div>
        <div class="prediction-value" id="pred-buy">WAITING...</div>
        <div id="pred-multiplier">BET: 1X</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item"><div class="stat-label">WIN / LOSE</div><div class="stat-val" id="stat-wl">0W / 0L</div></div>
        <div class="stat-item"><div class="stat-label">WIN RATE</div><div class="stat-val" id="stat-wr">0.0%</div></div>
        <div class="stat-item"><div class="stat-label">ADAPTIVE COUNT</div><div class="stat-val" id="stat-sum-count">2</div></div>
        <div class="stat-item"><div class="stat-label">STREAK (W/L)</div><div class="stat-val" id="stat-streak">0 / 0</div></div>
    </div>

    <button class="btn" onclick="resetStatistics()">🔄 Reset Statistics</button>

    <div class="log-section" id="log-box">
        <div class="log-item log-success">System initialized. Fetching loop started...</div>
    </div>
</div>

<script>
    const SETTINGS = {
        POLLING_INTERVAL: 60000,
        SMALL_THRESHOLD: 4,
        API_URL: 'https://draw.ar-lottery01.com/TrxWinGo/TrxWinGo_1M/GetHistoryIssuePage.json'
    };

    // Global App States
    let sumCount = 2;
    let lastProcessedIssue = null;
    let currentPrediction = null;

    let stats = {
        wins: 0,
        losses: 0,
        currentWinStreak: 0,
        currentLossStreak: 0,
        maxWinStreak: 0,
        maxLossStreak: 0,
        totalPrediction: 0
    };

    // UI Logger
    function log(message, type = 'info') {
        const logBox = document.getElementById('log-box');
        const item = document.createElement('div');
        item.className = `log-item log-${type}`;
        item.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
        logBox.appendChild(item);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Classify Logic
    function classifyResult(number) {
        return number <= SETTINGS.SMALL_THRESHOLD ? 'SMALL' : 'BIG';
    }

    // Adaptive Sum Strategy Logic
    function generateAdaptivePrediction(results) {
        if (!results.length) return { prediction: "BIG", sumCount: 2 };
        
        // If results count is less than target sumCount, fallback to available length
        const currentCount = results.length < sumCount ? results.length : sumCount;
        const lastResults = results.slice(0, currentCount);
        const sum = lastResults.reduce((acc, r) => acc + parseInt(r.number), 0);
        const prediction = sum % 2 === 1 ? "BIG" : "SMALL";
        
        log(`Logic analysis (${currentCount} items): ${lastResults.map(r => r.number).join('+')} = ${sum} (${sum % 2 === 1 ? "Odd" : "Even"}) -> ${prediction}`, 'info');
        return { prediction, sumCount: currentCount };
    }

    function updateAdaptiveSumState(wasWin) {
        if (wasWin) {
            sumCount = 2;
            log(`WIN! Resetting sum count to 2`, 'success');
        } else {
            const old = sumCount;
            sumCount = Math.min(sumCount + 1, 10);
            log(`LOSE! Increasing sum count from ${old} to ${sumCount}`, 'warn');
        }
        document.getElementById('stat-sum-count').innerText = sumCount;
    }

    // Core Data Fetch & Process
    async function fetchResults() {
        try {
            // Using a CORS proxy approach if direct fetch is blocked by browser safety
            const response = await fetch(`${SETTINGS.API_URL}?ts=${Date.now()}`);
            const json = await response.json();
            
            if (!json?.data?.list?.length) {
                log('No data received from api endpoint', 'warn');
                return null;
            }
            return json.data.list;
        } catch (error) {
            log(`API Fetch Failed: ${error.message}`, 'error');
            return null;
        }
    }

    async function processCycle() {
        const list = await fetchResults();
        if (!list) return;

        const latest = list[0];
        
        // Check if there is an active prediction that needs validation
        if (currentPrediction && currentPrediction.issueNumber === latest.issueNumber) {
            const actualResult = classifyResult(parseInt(latest.number));
            const won = currentPrediction.prediction === actualResult;

            stats.totalPrediction++;
            if (won) {
                stats.wins++;
                stats.currentWinStreak++;
                stats.currentLossStreak = 0;
                stats.maxWinStreak = Math.max(stats.maxWinStreak, stats.currentWinStreak);
                log(`Issue ${latest.issueNumber} Result Match: WIN (${actualResult})`, 'success');
            } else {
                stats.losses++;
                stats.currentLossStreak++;
                stats.currentWinStreak = 0;
                stats.maxLossStreak = Math.max(stats.maxLossStreak, stats.currentLossStreak);
                log(`Issue ${latest.issueNumber} Result Match: LOSE (${actualResult})`, 'error');
            }
            
            updateAdaptiveSumState(won);
            updateUIStats();
            currentPrediction = null; 
        }

        // Generate Next Prediction if it's a new issue cycle
        if (lastProcessedIssue !== latest.issueNumber) {
            lastProcessedIssue = latest.issueNumber;

            // Generate next issue tag (e.g., ...001 -> ...002)
            const issueParts = latest.issueNumber.split('');
            const numericPart = parseInt(issueParts.slice(-5).join(''));
            const nextIssue = issueParts.slice(0, -5).join('') + (numericPart + 1).toString().padStart(5, '0');

            const predData = generateAdaptivePrediction(list);
            
            currentPrediction = {
                issueNumber: nextIssue,
                prediction: predData.prediction
            };

            // Display Prediction UI
            document.getElementById('pred-issue').innerText = `MATCH: ${nextIssue.slice(-5)}`;
            document.getElementById('pred-buy').innerText = predData.prediction;
            document.getElementById('pred-multiplier').innerText = `BET: ${stats.currentLossStreak + 1}X`;
            
            log(`New Prediction Generated for ${nextIssue} -> ${predData.prediction}`, 'info');
        }
    }

    function updateUIStats() {
        const wr = stats.totalPrediction > 0 ? ((stats.wins / stats.totalPrediction) * 100).toFixed(1) : '0.0';
        document.getElementById('stat-wl').innerText = `${stats.wins}W / ${stats.losses}L`;
        document.getElementById('stat-wr').innerText = `${wr}%`;
        document.getElementById('stat-streak').innerText = `${stats.maxWinStreak} / ${stats.maxLossStreak}`;
    }

    function resetStatistics() {
        stats = { wins: 0, losses: 0, currentWinStreak: 0, currentLossStreak: 0, maxWinStreak: 0, maxLossStreak: 0, totalPrediction: 0 };
        sumCount = 2;
        currentPrediction = null;
        lastProcessedIssue = null;
        updateUIStats();
        document.getElementById('stat-sum-count').innerText = sumCount;
        log('All statistics and sum configurations reset.', 'success');
        processCycle();
    }

    // Countdown Timer Loop (Syncs on 60 seconds interval)
    function startTimer() {
        setInterval(() => {
            const now = new Date();
            const remaining = 60 - now.getSeconds();
            document.getElementById('countdown').innerText = `${remaining}s`;
            
            // Sync up data pull precisely at the turn of the new minute (xx:xx:00)
            if (now.getSeconds() === 0 || now.getSeconds() === 30) { 
                processCycle();
            }
        }, 1000);
    }

    // Start
    processCycle();
    startTimer();
</script>
</body>
</html>
